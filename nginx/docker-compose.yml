services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    networks:
      - treafik_proxy
    volumes:
      - ./sites:/www:ro
      - ./conf.d:/etc/nginx/conf.d:ro
    labels:
      - "traefik.enable=false"

  portfolio:
    build:
      context: ./sites/portfolio
      dockerfile: Dockerfile
    container_name: portfolio
    restart: unless-stopped
    networks:
      - treafik_proxy
    volumes:
      - portfolio_data:/app/data
    environment:
      - NODE_ENV=production
      - ADMIN_PASSWORD=${PORTFOLIO_ADMIN_PASSWORD}
      - DATABASE_PATH=/app/data/portfolio.db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portfolio-rtr.entrypoints=websecure"
      - "traefik.http.routers.portfolio-rtr.rule=Host(`quentin.balezeau.fr`)"
      - "traefik.http.routers.portfolio-rtr.middlewares=chain-no-auth@file"
      - "traefik.http.routers.portfolio-rtr.service=portfolio-svc"
      - "traefik.http.services.portfolio-svc.loadbalancer.server.port=3000"
