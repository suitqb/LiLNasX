services:
  traefik:
    container_name: traefik
    image: traefik:latest
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      treafik_proxy:
        ipv4_address: 192.168.90.9
      socket_proxy:
    command:
      # --- Global ---
      - --global.checkNewVersion=true
      - --global.sendAnonymousUsage=false

      # --- API / Dashboard ---
      - --api=true
      - --api.dashboard=true

      # --- Logs ---
      - --log=true
      - --log.filePath=/logs/traefik.log
      - --log.level=ERROR
      - --accessLog=true
      - --accessLog.filePath=/logs/access.log
      - --accessLog.bufferingSize=100
      - --accessLog.filters.statusCodes=204-299,400-499,500-599

      # --- Entrypoint : HTTP (80) → redirect HTTPS + HTTP/3 ---
      - --entrypoints.web.address=:80
      - --entrypoints.web.http3=true
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --entrypoints.web.forwardedHeaders.trustedIPs=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,127.0.0.1/32,10.0.0.0/8,192.168.0.0/16,172.16.0.0/12

      # --- Entrypoint : HTTPS (443) + TLS wildcard + HTTP/3 ---
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http3=true
      - --entrypoints.websecure.http.tls=true
      - --entrypoints.websecure.http.tls.options=tls-opts@file
      - --entrypoints.websecure.http.tls.certresolver=dns-cloudflare
      - --entrypoints.websecure.http.tls.domains[0].main=balezeau.fr
      - --entrypoints.websecure.http.tls.domains[0].sans=*.balezeau.fr
      - --entrypoints.websecure.forwardedHeaders.trustedIPs=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,127.0.0.1/32,10.0.0.0/8,192.168.0.0/16,172.16.0.0/12

      # --- Entrypoint interne Traefik (dashboard API) ---
      - --entrypoints.traefik.address=:8080

      # --- Entrypoints Mail (TCP passthrough → Stalwart) ---
      - --entrypoints.smtp.address=:25
      - --entrypoints.smtp.proxyProtocol.trustedIPs=192.168.90.0/24
      - --entrypoints.smtps.address=:465
      - --entrypoints.smtps.proxyProtocol.trustedIPs=192.168.90.0/24
      - --entrypoints.imaps.address=:993
      - --entrypoints.imaps.proxyProtocol.trustedIPs=192.168.90.0/24

      # --- Providers ---
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=treafik_proxy
      - --providers.file.directory=/rules
      - --providers.file.watch=true

      # --- Certificats ACME — Cloudflare DNS Challenge ---
      - --certificatesResolvers.dns-cloudflare.acme.email=${ACME_EMAIL}
      - --certificatesResolvers.dns-cloudflare.acme.storage=/acme.json
      - --certificatesResolvers.dns-cloudflare.acme.keyType=EC256
      - --certificatesResolvers.dns-cloudflare.acme.dnsChallenge.provider=cloudflare
      - --certificatesResolvers.dns-cloudflare.acme.dnsChallenge.resolvers=1.1.1.1:53,1.0.0.1:53
      - --certificatesResolvers.dns-cloudflare.acme.dnsChallenge.delayBeforeCheck=90

    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: udp
        mode: host
      - target: 25
        published: 25
        protocol: tcp
        mode: host
      - target: 465
        published: 465
        protocol: tcp
        mode: host
      - target: 993
        published: 993
        protocol: tcp
        mode: host
    volumes:
      - ./rules:/rules
      - ./acme/acme.json:/acme.json
      - ./logs:/logs
    environment:
      - TZ=Europe/Paris
      - CF_DNS_API_TOKEN_FILE=/run/secrets/api_token_cloudflare
      - DOMAINNAME
    secrets:
      - api_token_cloudflare
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-rtr.entrypoints=websecure"
      - "traefik.http.routers.traefik-rtr.rule=Host(`traefik.balezeau.fr`)"
      - "traefik.http.routers.traefik-rtr.service=api@internal"
      - "traefik.http.routers.traefik-rtr.middlewares=chain-auth@file"

  traefik-certs-dumper:
    image: ghcr.io/kereis/traefik-certs-dumper:latest
    container_name: traefik-certs-dumper
    restart: unless-stopped
    depends_on:
      - traefik
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./acme:/traefik:ro
      - certs:/output
